<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef8ff"><title>RE Learning Dashboard</title><style>
:root{--navy:#10265a;--ink:#1a294a;--muted:#60738f;--border:#c9e1f6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fbfdff,#f1f8ff 55%,#fff);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft Yahei",sans-serif;color:var(--ink)}main{width:min(1120px,calc(100% - 32px));margin:30px auto 60px}.topbar{margin-bottom:18px}.back{display:inline-flex;align-items:center;gap:7px;padding:11px 16px;border:2px solid var(--border);border-radius:14px;background:#fff;color:var(--navy);text-decoration:none;font-weight:800}.hero{padding:25px 28px;border:2px solid var(--border);border-radius:26px;background:linear-gradient(120deg,#e7f5ff,#f9fcff);box-shadow:0 12px 30px rgba(37,95,145,.08)}h1{margin:0;color:var(--navy);font-size:clamp(28px,4vw,42px)}.hero p{margin:8px 0 0;color:var(--muted)}.units{margin-top:18px}.unit-stat{border:2px solid #d5e8f8;border-radius:20px;margin:12px 0;overflow:hidden;background:#fff}.unit-stat>summary{cursor:pointer;list-style:none;padding:16px 18px;font-weight:850;color:var(--navy);display:flex;gap:12px;align-items:center;background:linear-gradient(110deg,#fbfdff,#f2faff)}.unit-stat>summary::-webkit-details-marker{display:none}.unit-name{display:grid;place-items:center;min-width:46px;height:38px;border-radius:11px;background:linear-gradient(145deg,#2bd9df,#168be9 70%);color:#fff}.metric{font-size:13px;color:#60738f;font-weight:750}.stat-detail{border-top:1px solid #e3eef8;padding:16px 18px;background:#fbfdff}.stat-detail h2{font-size:16px;margin:18px 0 8px;color:#24466d}.stat-detail h2:first-child{margin-top:0}.stat-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}.stat-table td{padding:7px 9px;border-bottom:1px solid #edf2f7;vertical-align:top}.stat-table td:last-child{text-align:right;font-weight:850;white-space:nowrap;color:var(--navy)}.sentence-text{color:#74869e;line-height:1.35}.reward{display:flex;gap:10px;flex-wrap:wrap}.coin{padding:8px 12px;border:1px solid #dae8f5;border-radius:12px;background:#fff;font-weight:800}.empty{color:#91a0b3;font-style:italic;padding:7px 0}@media(max-width:680px){main{width:min(100% - 20px,560px);margin:16px auto 35px}.back{font-size:13px;padding:9px 12px}.hero{padding:20px;border-radius:21px}.unit-stat>summary{padding:13px}.metric{display:none}.stat-detail{padding:13px}.stat-table{font-size:12px}}
</style></head><body><main><div class="topbar"><a class="back" href="../">← 返回 Reading Explorer 3</a></div><section class="hero"><h1>📊 RE Learning Dashboard</h1><p>精听、词汇与学习奖励统计 · 点击 Unit 查看详细数据</p></section><section class="units" id="dashboardUnits"></section></main><script>
const RE_STATS_KEY='re3_learning_stats_v1',UNIT_NAMES={'1B':'What Makes an Olympic Champion?','2A':'What Is Beauty?'};
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderDashboard(){const stats=JSON.parse(localStorage.getItem(RE_STATS_KEY)||'{}'),root=document.getElementById('dashboardUnits');root.innerHTML='';Object.keys(UNIT_NAMES).forEach(id=>{const u=stats[id]||{},listening=u.listening||{},vocab=u.vocabulary||{},rewards=u.rewards||{},plays=Object.values(listening).reduce((a,x)=>a+(x.plays||0),0),wrong=Object.values(vocab).reduce((a,x)=>a+(x.wrongAttempts||0),0);const rows=Object.values(listening).sort((x,y)=>String(x.paragraph).localeCompare(String(y.paragraph))||(x.sentence-y.sentence)).map(x=>'<tr><td><b>Paragraph '+esc(x.paragraph)+' · Sentence '+x.sentence+'</b><br><span class="sentence-text">'+esc(x.text)+'</span></td><td>'+x.plays+' 次</td></tr>').join('');const vrows=Object.entries(vocab).sort((a,b)=>(b[1].wrongAttempts||0)-(a[1].wrongAttempts||0)).map(([w,x])=>'<tr><td>'+esc(w)+'</td><td>'+x.wrongAttempts+' 次</td></tr>').join('');const el=document.createElement('details');el.className='unit-stat';el.open=id==='2A';el.innerHTML='<summary><span class="unit-name">'+id+'</span><span style="flex:1">'+UNIT_NAMES[id]+'</span><span class="metric">🎧 '+plays+' 次播放 · ❌ '+wrong+' 次词汇错误</span></summary><div class="stat-detail"><h2>🎧 精听 · 每句音频播放次数</h2>'+(rows?'<table class="stat-table">'+rows+'</table>':'<div class="empty">暂无播放记录</div>')+'<h2>📚 词汇 · 每个词错误次数</h2>'+(vrows?'<table class="stat-table">'+vrows+'</table>':'<div class="empty">暂无词汇错误记录</div>')+'<h2>🏦 奖励 · 本 Unit 累计获得</h2><div class="reward"><span class="coin">🟤 '+(rewards.knut||0)+' Knut</span><span class="coin">⚪ '+(rewards.sickle||0)+' Sickle</span><span class="coin">🟡 '+(rewards.galleon||0)+' Galleon</span></div></div>';root.appendChild(el)})}renderDashboard();
</script></body></html>
